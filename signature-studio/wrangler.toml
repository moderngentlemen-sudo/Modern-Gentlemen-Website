# Signature Studio: app + image host in ONE Cloudflare Worker.
#
# - Files in ./dist (the built app) are served as static assets.
# - Any request that is not a file in ./dist (that is, /s/<hash>.<ext>) runs
#   worker/src/index.ts, which stores and serves signature images from R2.
#
# Deployed automatically by .github/workflows/signature-studio-deploy.yml.
# The upload key is a secret set by that workflow (never committed here).
name = "signature-studio"
main = "worker/src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./dist"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "signature-studio-images"

[vars]
# The app uploads from its own origin, so no cross-origin upload is needed.
ALLOWED_ORIGINS = ""
