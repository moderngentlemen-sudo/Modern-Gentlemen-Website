name: Signature Studio stabilization

on:
  pull_request:
    branches: [signature-studio-v1]
    paths:
      - 'signature-studio-v1/**'
      - '.github/workflows/signature-studio-stabilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signature-studio-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright numpy opencv-python-headless
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
      - name: Syntax
        run: npm run check
      - name: Unit and regression tests
        run: npm test
      - name: Unified browser workflows
        run: python tests/unified_browser.py
      - name: Alignment browser workflows
        run: python tests/alignment_browser.py
      - name: Block browser workflows
        run: python tests/blocks_browser.py
