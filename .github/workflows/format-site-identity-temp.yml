name: Format Site Identity (temporary)
on:
  push:
    branches: [feat/appearance-studio-site-identity]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: design_handoff_modern_gentlemen/starter/.nvmrc
      - run: npm ci
        working-directory: design_handoff_modern_gentlemen/starter
      - name: Format only affected identity files
        working-directory: design_handoff_modern_gentlemen/starter
        run: >
          npx prettier --write
          components/admin/SiteIdentityControls.tsx
          lib/domain/siteIdentity.test.ts
          tests/e2e/siteIdentity.spec.ts
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_handoff_modern_gentlemen/starter/components/admin/SiteIdentityControls.tsx
          git add design_handoff_modern_gentlemen/starter/lib/domain/siteIdentity.test.ts
          git add design_handoff_modern_gentlemen/starter/tests/e2e/siteIdentity.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "Format Appearance Studio site identity files"
          git push origin HEAD:feat/appearance-studio-site-identity
