name: Temporary site access formatting
on:
  push:
    branches: [feat/site-access-launch-controls]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: design_handoff_modern_gentlemen/starter/.nvmrc
      - run: npm ci
        working-directory: design_handoff_modern_gentlemen/starter
      - name: Format site-access files
        working-directory: design_handoff_modern_gentlemen/starter
        run: |
          npx prettier --write \
            "app/(site)/layout.tsx" \
            "components/admin/AppearanceStudio.tsx" \
            "components/admin/SiteAccessControls.tsx" \
            "lib/domain/siteAccessState.ts" \
            "lib/services/siteAccess.ts" \
            "middleware.ts" \
            "README.md" \
            "tests/e2e/siteAccessLaunch.spec.ts" \
            "tests/integration/siteAccessRls.test.ts"
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design_handoff_modern_gentlemen/starter
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "Format site access and launch controls"
          git push origin HEAD:feat/site-access-launch-controls
