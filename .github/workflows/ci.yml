name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Next.js app is not at the repository root.
  APP_DIR: design_handoff_modern_gentlemen/starter

  # `canonicalSiteUrl()` refuses to fall back to localhost when NODE_ENV is
  # production — which `next build` sets, here as much as on Railway — so
  # without this the build fails on the first route that asks for a canonical
  # URL. localhost:3000 is the honest answer for CI: it is where the runner
  # actually serves the built site, so the canonicals and sitemap this build
  # emits describe the stack under test rather than a machine nobody can reach.
  #
  # At the top level rather than per-step deliberately. The Supabase pair is
  # repeated across eight `env:` blocks, and a ninth step added later that
  # forgets this one would fail in a way whose message points at Railway.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # The Supabase CLI, pinned rather than `latest`.
  #
  # `supabase/setup-cli@v1` with `version: latest` resolves through the GitHub
  # API on every run, and it rate-limited on 2026-08-09 — failing the Integration
  # job 21 seconds in, on a commit that touched only PROGRESS.md:
  #
  #   ##[error]Failed to resolve latest Supabase CLI release: rate limit exceeded
  #
  # Two jobs start a stack, so `latest` cost two lookups per run and made the
  # toolchain irreproducible into the bargain: the same migrations would meet a
  # different binary next month. Same trade already made for Playwright, which is
  # pinned to 1.56.1 to match the preinstalled browsers.
  #
  # Top-level for the reason NEXT_PUBLIC_SITE_URL is: a third stack-starting job
  # added later would otherwise quietly reintroduce `latest`.
  #
  # Bumping is a deliberate act. This value is what `latest` resolved to when the
  # pin was introduced, so adopting it changed nothing.
  SUPABASE_CLI_VERSION: 2.113.0

defaults:
  run:
    working-directory: design_handoff_modern_gentlemen/starter

jobs:
  # Fast feedback: static analysis and the unit/component pyramid base.
  verify:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: design_handoff_modern_gentlemen/starter/.nvmrc
          cache: npm
          cache-dependency-path: design_handoff_modern_gentlemen/starter/package-lock.json

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      # Needs no secrets, no stack and no database — which is why it belongs in
      # the fast job rather than beside the tests. Fails when code reads an
      # environment variable `.env.example` does not declare. PROGRESS.md records
      # that exact bug three times (JOBS_SECRET, SUPABASE_SERVICE_ROLE_KEY,
      # NEXT_PUBLIC_SITE_URL) and asked for this check by name; it found a fourth
      # on its first run.
      - name: Environment variables are declared
        run: node scripts/check-env.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      # Advisory only: docs discipline must never block a hotfix.
      - name: PROGRESS.md freshness
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          if echo "$CHANGED" | grep -q '^design_handoff_modern_gentlemen/starter/'; then
            if ! echo "$CHANGED" | grep -q '^PROGRESS.md$'; then
              echo "::warning title=PROGRESS.md not updated::This PR changes starter/ but does not update PROGRESS.md - it is the session handoff document, please refresh it."
            fi
          fi

  # Services, repositories and RLS policies against a real Postgres.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: design_handoff_modern_gentlemen/starter/.nvmrc
          cache: npm
          cache-dependency-path: design_handoff_modern_gentlemen/starter/package-lock.json

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase stack
        run: supabase start --workdir .

      - name: Export stack credentials
        run: |
          # `supabase status -o env` emits API_URL / ANON_KEY / SERVICE_ROLE_KEY
          # for the throwaway local stack. No production secret is involved.
          #
          # It emits them shell-quoted — API_URL="http://127.0.0.1:54321" — and
          # $GITHUB_ENV takes the right-hand side literally, so without stripping
          # the quotes every consumer receives a value that still has them,
          # and supabase-js rejects the URL as malformed.
          supabase status --workdir . -o env \
            | sed -E 's/^/SUPABASE_/; s/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      # `supabase start` applies every migration once. This applies them a
      # second time, on top of themselves, which is the only thing that actually
      # proves they are re-runnable.
      #
      # It matters because the Supabase GitHub integration replays every
      # migration it does not recognise, and it recognises none of ours: the
      # live project records 14-digit timestamp versions while this repo numbers
      # its files 0001–0014. Postgres has no `create policy if not exists` and
      # none for triggers, so before the drop-if-exists guards were added, a
      # replay hit 42710 on the first of 92 policies and failed the deploy.
      # Without this step that guarantee would be a claim in a comment.
      - name: Migrations are idempotent
        run: |
          for f in supabase/migrations/*.sql; do
            echo "re-applying $(basename "$f")"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # The stack is empty after `supabase start` — migrations only, no rows.
      # publicCatalog.test.ts asserts the published store equals the demo
      # catalogue, which needs the catalogue to have been seeded; without this
      # it compares 16 products against 0.
      - name: Seed content
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/seed.ts

      - name: Integration tests
        env:
          SUPABASE_TEST_URL: ${{ env.SUPABASE_API_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          # `lib/services/publicCatalog.ts` builds its client through
          # `lib/db/public.ts`, which reads the NEXT_PUBLIC_* pair like the app
          # does — it is the app's code path, not a test-only one. The
          # SUPABASE_TEST_* names above are for the fixtures.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: npm run test:integration -- --passWithNoTests

      - name: Stop stack
        if: always()
        run: supabase stop --workdir . || true

  # Critical journeys and the screenshot guard on the pixel-verified design.
  e2e:
    name: E2E & visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: design_handoff_modern_gentlemen/starter/.nvmrc
          cache: npm
          cache-dependency-path: design_handoff_modern_gentlemen/starter/package-lock.json

      - run: npm ci

      # GitHub runners have no preinstalled browsers, unlike the dev container.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase stack
        run: supabase start --workdir .

      - name: Export stack credentials
        # Quotes stripped for the same reason as the integration job above.
        run: |
          supabase status --workdir . -o env \
            | sed -E 's/^/SUPABASE_/; s/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      # Without this the signed-in specs skip, which is what they had been doing
      # since Phase 1c: the stack is fresh every run and holds no accounts, so
      # E2E_ADMIN_* were never set and the whole authenticated half of the suite
      # silently passed by doing nothing. Roles and permissions come from
      # migration 0001, which `supabase start` has already applied, so
      # create-admin.ts is all that is needed on top.
      #
      # The password is a literal on purpose. It unlocks a throwaway local stack
      # that is destroyed at the end of the job and is reachable only from this
      # runner; a repository secret here would imply it guards something.
      - name: Provision the admin account
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_ADMIN_EMAIL: ci-admin@moderngentlemen.test
          SEED_ADMIN_PASSWORD: ci-local-stack-password
        run: |
          npx --yes tsx scripts/create-admin.ts
          {
            echo "E2E_ADMIN_EMAIL=ci-admin@moderngentlemen.test"
            echo "E2E_ADMIN_PASSWORD=ci-local-stack-password"
          } >> "$GITHUB_ENV"

      # The build now READS the database, so a fresh stack has to hold content
      # before `next build` runs.
      #
      # Since Phase 7a the homepage renders from `pages` rather than from
      # lib/demo/home-sections.ts, and it throws rather than falling back — a
      # silent fallback would let a broken read ship a plausible page. That is
      # the right behaviour and it makes seeding a build dependency: without
      # this step `supabase start` leaves `pages` empty and the build fails on
      # "No published page with slug home".
      #
      # seed.ts is idempotent and reads the same demo modules the route used to
      # import, so the built site is byte-for-byte what the visual baselines
      # were captured against.
      - name: Seed content
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/seed.ts

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e

      # Runs even when the E2E step failed. The two answer different questions,
      # and a broken spec must not be able to hide a pixel regression: run #53
      # failed on three locator mistakes in one new spec and took the 16
      # baselines down with it, which is how a chrome change reached review with
      # its most important gate unexecuted.
      - name: Visual regression
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.APP_DIR }}/playwright-report
          retention-days: 14

      - name: Stop stack
        if: always()
        run: supabase stop --workdir . || true
