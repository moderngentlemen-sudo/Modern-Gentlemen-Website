<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html{scroll-behavior:smooth;overflow-x:clip;}
body{margin:0;background:#0d0d0d;color:var(--mg-fg,#f4f4f4);-webkit-font-smoothing:antialiased;}
a{color:var(--mg-fg,#f4f4f4);text-decoration:none;}
a:hover{color:#ff4d5e;}
[data-chip]{transition:background .18s ease,border-color .18s ease,color .18s ease;cursor:pointer;}
[data-chip]:hover,[data-chip][data-on="true"]{background:#C8102E;border-color:#C8102E;color:#fff;}
[data-prod]{transition:transform .2s ease,border-color .2s ease;}
[data-prod]:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--mg-bd,#ffffff) 20%,transparent);}
[data-prod] [data-pimg]{transition:transform .5s cubic-bezier(.2,.7,.2,1);}
[data-prod]:hover [data-pimg]{transform:scale(1.06);}
[data-add]{transition:background .18s ease,color .18s ease;cursor:pointer;}
[data-add]:hover{background:#C8102E;color:#fff;border-color:#C8102E;}
@media (max-width:1024px) and (min-width:681px){[data-pgrid]{grid-template-columns:repeat(2,1fr)!important;}}
@media (max-width:680px){
  [data-shophero] h1{font-size:48px!important;}
  [data-pgrid]{grid-template-columns:1fr 1fr!important;gap:12px!important;}
  [data-prod] h3{font-size:15px!important;}
  [data-page] section{padding-left:22px!important;padding-right:22px!important;}
}
@media (max-width:460px){
  [data-pgrid]{grid-template-columns:1fr!important;}
  [data-prodbody]{align-items:center;text-align:center;}
  [data-prodfoot]{justify-content:center!important;gap:16px!important;}
}

/* ===== Light theme (driven by shared MG Header toggle) ===== */
[data-page]{--mg-fg:#f4f4f4;}
html[data-mgtheme="light"] [data-page]{background:#f4f4f4!important;--mg-fg:#141414;--mg-surface:#ffffff;--mg-bd:#141414;}
html[data-mgtheme="light"] [data-page] [data-darkband]{--mg-fg:#f4f4f4;--mg-bd:#ffffff;color:#f4f4f4;}

html[data-mgtheme="light"]{background:#f4f4f4;}
html[data-mgtheme="light"] body{background:#f4f4f4;color:#141414;}
/* minimal neutral skeleton: only guaranteed-correct elements (burger + logo + search) */
@media (max-width:680px){#mg-header-skeleton{padding-left:20px!important;padding-right:20px!important;}}
html[data-mgtheme="light"] #mg-header-skeleton{color:#141414!important;}
html[data-mgtheme="light"] #mg-header-skeleton img{filter:invert(1)!important;}
html[data-mgtheme="light"] #mg-header-skeleton [data-skburger] span:nth-child(1){background:#141414!important;}
/* hide the dc-import loading placeholder box for MG Header — the skeleton covers it */
#mg-header-skeleton + * .sc-placeholder,#mg-header-skeleton + .sc-placeholder{display:none!important;}
[data-page][data-narrow="true"] > section{max-width:1320px;}
html[data-mgtheme="dark"]{background:#0d0d0d;}
</style>
<script src="mg-catalog.js"></script>
<script src="mg-bag.js"></script>
<script>try{document.documentElement.setAttribute('data-mgtheme',(localStorage.getItem('mg-theme')||'light'));}catch(e){}</script>

</helmet>
<div data-page data-narrow="{{ narrowShop }}" style="min-height:100vh;background:#0d0d0d;">
  <!-- instant static header (removed by MG Header on mount) prevents a blank bar on navigation -->
  <div id="mg-header-skeleton" style="position:fixed;top:0;left:0;right:0;z-index:59;height:72px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:2px max(48px, calc((100% - 1320px) / 2)) 0;background:transparent;pointer-events:none;color:#fff;"><div style="display:flex;align-items:center;gap:14px;flex-shrink:0;"><span data-skburger style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;width:22px;"><span style="width:22px;height:2px;border-radius:2px;background:#f4f4f4;display:block;"></span><span style="width:13px;height:2px;border-radius:2px;background:#C8102E;display:block;box-shadow:0 0 8px 0 rgba(200,16,46,0.45);"></span></span><img src="mg-logo.svg" alt="" style="height:20px;width:auto;display:block;"></div><span data-skicon style="display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg></span></div>
  <dc-import name="MG Header" hint-size="100%,64px" dark-mode="{{ darkMode }}" sharp-corners="{{ sharpCorners }}" header-style="{{ headerStyle }}" header-scheme="{{ headerScheme }}" invert-header="{{ invertHeader }}" header-scale="{{ headerScale }}" header-height="{{ headerHeight }}" shrink-on-scroll="{{ shrinkOnScroll }}" shrunk-height="{{ shrunkHeight }}" nav-motion="{{ navMotion }}" hide-on-scroll="{{ hideOnScroll }}" always-frosted="{{ alwaysFrosted }}" header-divider="{{ headerDivider }}" burger-variant="{{ burgerVariant }}" burger-hover="{{ burgerHover }}" menu-hover="{{ menuHover }}" icon-bubbles="{{ iconBubbles }}" icon-bubble-hover="{{ iconBubbleHover }}" icon-hover="{{ iconHover }}" sidebar-entry="{{ sidebarEntry }}" dropdown-anim="{{ dropdownAnim }}" dropdown-exit="{{ dropdownExit }}" sidebar-bubbles="{{ sidebarBubbles }}" chevron-bubbles="{{ chevronBubbles }}" sidebar-tagline="{{ sidebarTagline }}" sidebar-logo="{{ sidebarLogo }}"></dc-import>

  <section data-shophero data-screen-label="Shop hero" style="box-sizing:border-box;margin:0 auto;padding:150px max(48px, calc((100% - 1320px) / 2)) 44px;border-bottom:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 9%,transparent);">
    <div style="font:400 11px 'IBM Plex Mono',monospace;letter-spacing:0.28em;color:#ff4d5e;margin-bottom:24px;">THE MG STORE</div>
    <h1 style="margin:0;font:600 72px/0.96 'Space Grotesk',sans-serif;letter-spacing:-0.045em;">Objects worth keeping.</h1>
    <p style="margin:26px 0 0;max-width:560px;font:400 22px/1.45 'Instrument Serif',serif;font-style:italic;color:color-mix(in srgb,var(--mg-fg,#f4f4f4) 78%,transparent);">A short, honest list of things we actually use — chosen to last, tested by the desk.</p>
    <div style="margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button data-chip data-on="{{ f.on }}" onClick="{{ f.select }}" style="padding:10px 20px;border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 22%,transparent);border-radius:100px;font:400 10px 'IBM Plex Mono',monospace;letter-spacing:0.16em;color:color-mix(in srgb,var(--mg-fg,#f4f4f4) 85%,transparent);background:none;">{{ f.label }}</button>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Products" style="box-sizing:border-box;margin:0 auto;padding:48px max(48px, calc((100% - 1320px) / 2)) 0;">
    <div data-pgrid style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;">
      <sc-for list="{{ products }}" as="p" hint-placeholder-count="8">
        <div data-prod style="display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--mg-surface,#131315);border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 9%,transparent);">
          <a href="{{ p.href }}" style="position:relative;overflow:hidden;aspect-ratio:4/5;display:block;">
            <div data-pimg style="position:absolute;inset:0;background-color:#0d0d0d;background-image:{{ p.bg }};background-size:cover;background-position:center;"></div>
            <sc-if value="{{ p.tag }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:12px;left:12px;font:400 8.5px 'IBM Plex Mono',monospace;letter-spacing:0.18em;color:#fff;background:rgba(200,16,46,0.92);padding:4px 10px;border-radius:100px;">{{ p.tag }}</span></sc-if>
          </a>
          <div data-prodbody style="padding:18px 18px 20px;display:flex;flex-direction:column;flex:1;min-width:0;">
            <div style="font:400 9px 'IBM Plex Mono',monospace;letter-spacing:0.18em;color:color-mix(in srgb,var(--mg-fg,#f4f4f4) 45%,transparent);">{{ p.cat }}</div>
            <h3 style="margin:8px 0 0;font:500 17px/1.15 'Space Grotesk',sans-serif;letter-spacing:-0.015em;overflow-wrap:anywhere;"><a href="{{ p.href }}" style="color:var(--mg-fg,#f4f4f4);">{{ p.name }}</a></h3>
            <div data-prodfoot style="margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <span style="font:500 16px 'Space Grotesk',sans-serif;color:var(--mg-fg,#f4f4f4);">{{ p.price }}</span>
              <button data-add onClick="{{ p.add }}" style="flex-shrink:0;padding:8px 14px;border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 22%,transparent);border-radius:100px;background:none;color:var(--mg-fg,#f4f4f4);font:400 8.5px 'IBM Plex Mono',monospace;letter-spacing:0.16em;">{{ p.addLabel }}</button>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Cart note" style="box-sizing:border-box;margin:56px auto 0;padding:0 max(48px, calc((100% - 1320px) / 2));">
    <div style="border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 12%,transparent);border-radius:12px;background:var(--mg-surface,#131315);padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;">
      <div style="font:400 13px 'IBM Plex Mono',monospace;letter-spacing:0.06em;color:color-mix(in srgb,var(--mg-fg,#f4f4f4) 70%,transparent);">{{ cartLine }}</div>
      <a data-add href="MG Bag.dc.html" style="padding:12px 26px;border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 22%,transparent);border-radius:100px;font:400 9px 'IBM Plex Mono',monospace;letter-spacing:0.2em;color:var(--mg-fg,#f4f4f4);">VIEW BAG →</a>
    </div>
  </section>

  <section data-screen-label="Members note" style="box-sizing:border-box;margin:56px auto 96px;padding:0 max(48px, calc((100% - 1320px) / 2));">
    <div style="border-radius:14px;background:var(--mg-surface,#161618);border:1px solid color-mix(in srgb,var(--mg-bd,#ffffff) 10%,transparent);padding:48px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;">
      <div style="max-width:560px;">
        <div style="font:400 10px 'IBM Plex Mono',monospace;letter-spacing:0.24em;color:#ff4d5e;">MEMBERS SAVE 15%</div>
        <h2 style="margin:12px 0 0;font:600 30px/1.1 'Space Grotesk',sans-serif;letter-spacing:-0.03em;">Every order, every time.</h2>
      </div>
      <a data-cta href="MG Membership.dc.html" style="padding:14px 30px;border-radius:100px;background:#C8102E;color:#fff;font:400 10px 'IBM Plex Mono',monospace;letter-spacing:0.2em;">BECOME A MEMBER →</a>
    </div>
  </section>

  <dc-import name="MG Footer" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:1000},&quot;narrowShop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;bagStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Slide-in drawer&quot;,&quot;options&quot;:[&quot;Slide-in drawer&quot;,&quot;Dropdown&quot;,&quot;Full page&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bag&quot;},&quot;sidebarLogo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Wordmark&quot;,&quot;options&quot;:[&quot;MG monogram&quot;,&quot;Wordmark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sidebar&quot;}}">
class Component extends DCLogic {
  state = { filter: 'All', added: null };

  componentDidMount() {
    this._onBag = () => this.forceUpdate();
    window.addEventListener('mg-bag-change', this._onBag);
    window.addEventListener('mg-bag-ready', this._onBag);
    // sync filter from ?cat= if present
    try {
      const cat = new URLSearchParams(location.search).get('cat');
      if (cat && (window.MGCatalog ? window.MGCatalog.groups : []).indexOf(cat) >= 0) this.setState({ filter: cat });
    } catch (e) {}
  }

  componentWillUnmount() {
    window.removeEventListener('mg-bag-change', this._onBag);
    window.removeEventListener('mg-bag-ready', this._onBag);
    clearTimeout(this._addTimer);
  }

  chromeProps() {
    return {
      darkMode: this.props.darkMode ?? false,
      sharpCorners: this.props.sharpCorners ?? true,
      headerStyle: this.props.headerStyle ?? 'Frosted',
      headerScheme: this.props.headerScheme ?? 'Auto',
      invertHeader: this.props.invertHeader ?? false,
      headerScale: this.props.headerScale ?? 1,
      headerHeight: this.props.headerHeight ?? 72,
      shrinkOnScroll: this.props.shrinkOnScroll ?? true,
      shrunkHeight: this.props.shrunkHeight ?? 58,
      navMotion: this.props.navMotion ?? 'Frost only',
      hideOnScroll: this.props.hideOnScroll ?? true,
      alwaysFrosted: this.props.alwaysFrosted ?? false,
      headerDivider: this.props.headerDivider ?? false,
      burgerVariant: this.props.burgerVariant ?? 'Sq thin pair',
      burgerHover: this.props.burgerHover ?? 'Staircase',
      menuHover: this.props.menuHover ?? 'Underline',
      iconBubbles: this.props.iconBubbles ?? false,
      iconBubbleHover: this.props.iconBubbleHover ?? false,
      iconHover: this.props.iconHover ?? 'Circle',
      sidebarEntry: this.props.sidebarEntry ?? 'Fade',
      dropdownAnim: this.props.dropdownAnim ?? 'Curtain',
      dropdownExit: this.props.dropdownExit ?? 'Collapse',
      sidebarLogo: this.props.sidebarLogo ?? 'MG monogram',
      sidebarBubbles: this.props.sidebarBubbles ?? false,
      chevronBubbles: this.props.chevronBubbles ?? false,
      sidebarTagline: this.props.sidebarTagline ?? 'The Men’s Lifestyle Guide',
    };
  }

  renderVals() {
    const cat = window.MGCatalog;
    const bag = window.MGBag;
    const fmt = (n) => (cat ? cat.format(n) : ('£' + n));
    const cats = cat ? cat.groups : ['All', 'Style', 'Watches', 'Grooming', 'Accessories'];
    const active = this.state.filter;
    const list = cat ? cat.byGroup(active) : [];
    const count = bag ? bag.count() : 0;
    return {
      ...this.chromeProps(),
      filters: cats.map((c) => ({ label: c.toUpperCase(), on: c === active ? 'true' : 'false', select: () => this.setState({ filter: c }) })),
      products: list.map((p) => ({
        cat: p.catLabel, name: p.name, price: fmt(p.price), tag: p.tag, bg: 'url(' + p.images[0] + ')',
        href: 'MG Product.dc.html?p=' + p.slug,
        addLabel: this.state.added === p.slug ? 'ADDED ✓' : 'ADD',
        add: () => {
          if (bag) bag.add(p.slug, 1);
          this.setState({ added: p.slug });
        }
      })),
      cartLine: count === 0 ? 'Your bag is empty — members get free shipping over £50.' : (count + (count === 1 ? ' item' : ' items') + ' in your bag · ' + fmt(bag ? bag.subtotal() : 0) + ' · free shipping over £50')
    };
  }
}
</script>
</body>
</html>
